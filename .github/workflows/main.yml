name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3

      - name: Auto-Detect and Build APK
        run: |
          echo "=== 1. Inspecting Repository Content ==="
          ls -la

          # البحث عن package.json أو build.gradle في أي مكان داخل المستودع
          PACKAGE_JSON=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          BUILD_GRADLE=$(find . -name "build.gradle*" -not -path "*/node_modules/*" | head -n 1)

          if [ -n "$PACKAGE_JSON" ]; then
            echo "Found existing package.json at: $PACKAGE_JSON"
            cd $(dirname "$PACKAGE_JSON")
            npm install --legacy-peer-deps || npm install
            if grep -q '"build":' package.json; then npm run build || true; fi
            if [ ! -d "android" ]; then npx cap add android || true; fi
            npx cap sync android || true
            cd "$GITHUB_WORKSPACE"
          elif [ -d "www" ] && [ -z "$BUILD_GRADLE" ]; then
            echo "Found 'www' directory without build manifest. Creating dynamic Capacitor project..."
            
            # إنشاء بيئة Capacitor وتغليف مجلد www تلقائياً
            npm init -y
            npm install @capacitor/core @capacitor/cli @capacitor/android
            
            npx cap init "Listen Now" "com.hus.listennow" --web-dir www
            npx cap add android
            npx cap sync android
          fi

          # البحث عن gradlew المنشأ وتجميع الـ APK
          GRADLEW_PATH=$(find . -name "gradlew" -not -path "*/node_modules/*" | head -n 1)

          if [ -n "$GRADLEW_PATH" ]; then
            echo "Found gradlew at: $GRADLEW_PATH. Starting build..."
            GRADLE_DIR=$(dirname "$GRADLEW_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Error: Failed to locate or generate Android project."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
