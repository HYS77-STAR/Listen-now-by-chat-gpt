name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3

      - name: Auto-Detect and Build APK
        run: |
          echo "=== 1. Inspecting Repository Content ==="
          ls -la

          PACKAGE_JSON=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          BUILD_GRADLE=$(find . -name "build.gradle*" -not -path "*/node_modules/*" | head -n 1)

          if [ -n "$PACKAGE_JSON" ]; then
            echo "Found existing package.json at: $PACKAGE_JSON"
            cd $(dirname "$PACKAGE_JSON")
            npm install --legacy-peer-deps || npm install
            if grep -q '"build":' package.json; then npm run build || true; fi
            if [ ! -d "android" ]; then npx cap add android || true; fi
            npx cap sync android || true
            cd "$GITHUB_WORKSPACE"
          elif [ -d "www" ] && [ -z "$BUILD_GRADLE" ]; then
            echo "Found 'www' directory. Building Capacitor project dynamically..."
            
            npm init -y
            npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
            
            # إنشاء ملف التهيئة بطريقة سريعة ومضمونة بدون أخطاء أسطر
            echo '{"appId":"com.hus.listennow","appName":"Listen Now","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json

            npx cap add android
            npx cap sync android
          fi

          # الموافقة التلقائية على تراخيص Android SDK
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # البحث عن gradlew والبدء في بناء الـ APK
          GRADLEW_PATH=$(find . -name "gradlew" -not -path "*/node_modules/*" | head -n 1)

          if [ -n "$GRADLEW_PATH" ]; then
            echo "Found gradlew at: $GRADLEW_PATH. Starting build..."
            GRADLE_DIR=$(dirname "$GRADLEW_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Error: Failed to locate or generate Android project."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
