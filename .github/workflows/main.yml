name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup & Build Android APK
        run: |
          # 1. إذا كان المشروع يحتوي على package.json يتم تثبيت المكتبات وتجهيز Capacitor
          if [ -f "package.json" ]; then
            echo "Installing Node dependencies..."
            npm install --legacy-peer-deps || npm install
            
            if grep -q '"build":' package.json; then
              npm run build || true
            fi

            echo "Syncing Capacitor Android project..."
            npx cap sync android || true
          fi

          # 2. البحث عن ملف gradlew في أي مكان داخل المشروع وتشغيله
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)

          if [ -n "$GRADLEW_PATH" ]; then
            echo "Found gradlew at: $GRADLEW_PATH"
            GRADLE_DIR=$(dirname "$GRADLEW_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Error: Could not find 'gradlew' file in the repository."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
