name: Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip Android Project
      run: |
        echo "Unzipping uploaded project..."
        unzip -o *.zip

    - name: Replace App Icon
      run: |
        if [ -f "app_icon.png" ]; then
          echo "Custom icon found! Replacing launcher icons..."
          find . -name "ic_launcher*.png" -exec cp app_icon.png {} \;
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Gradle Wrapper if missing
      run: |
        if [ ! -f "gradlew" ]; then
          echo "gradlew missing! Generating wrapper automatically..."
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Create Debug Keystore
      run: |
        echo "Creating debug keystore for app signing..."
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        cp debug.keystore app/ 2>/dev/null || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-android-app
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
